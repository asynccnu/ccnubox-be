name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'be-ccnu/**'
      - 'be-class/**'
      - 'be-classlist/**'
      - 'be-content/**'
      - 'be-counter/**'
      - 'be-elecprice/**'
      - 'be-feed/**'
      - 'be-grade/**'
      - 'be-library/**'
      - 'be-proxy/**'
      - 'be-user/**'
      - 'bff/**'
      - 'common/**'
      - '.github/workflows/deploy.yaml'

permissions:
  contents: read

# Only one main-branch deployment may touch the server at a time. Builds for
# the selected services still run in parallel, then one SSH session deploys
# all of them together to the preview (test) environment. Production is
# updated separately by the promote workflow, triggered by a promote-* tag.
concurrency:
  group: ccnubox-dev-deploy
  cancel-in-progress: false

jobs:
  changes:
    if: github.repository == 'asynccnu/ccnubox-be'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      service_list: ${{ steps.services.outputs.service_list }}
      version: ${{ steps.version.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select services
        id: services
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all_services=(
            be-ccnu
            be-class
            be-classlist
            be-content
            be-counter
            be-elecprice
            be-feed
            be-grade
            be-library
            be-proxy
            be-user
            bff
          )

          deploy_all=false
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            # A branch's first push has no previous revision to compare with.
            changed_files=''
            deploy_all=true
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # The previous tip can be unreachable after a force-push. Try to
              # recover it so the diff still covers the complete pushed range.
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
            fi

            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            else
              # Never risk omitting services changed by earlier commits in a
              # multi-commit force-push when the old tip cannot be recovered.
              changed_files=''
              deploy_all=true
            fi
          fi

          while IFS= read -r file; do
            case "$file" in
              common/*|.github/workflows/deploy.yaml)
                deploy_all=true
                ;;
            esac
          done <<< "$changed_files"

          selected_services=()
          for service in "${all_services[@]}"; do
            if [[ "$deploy_all" == true ]] || grep -q "^${service}/" <<< "$changed_files"; then
              selected_services+=("$service")
            fi
          done

          if ((${#selected_services[@]} == 0)); then
            services_json='[]'
          else
            services_json="$(printf '%s\n' "${selected_services[@]}" | jq -R . | jq -sc .)"
          fi
          service_list="${selected_services[*]}"
          {
            echo "services=$services_json"
            echo "service_list=$service_list"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Deployment selection'
            echo "- Deploy all: $deploy_all"
            echo "- Services: ${service_list:-none}"
            echo '- Changed files:'
            echo '```text'
            printf '%s\n' "${changed_files:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get commit id
        id: version
        run: echo "id=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    if: needs.changes.outputs.services != '[]'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Aliyun Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          registry: ${{ secrets.ALIYUN_REGISTRY }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/ccnubox-${{ matrix.service }}:${{ needs.changes.outputs.version }}
          build-args: ${{ matrix.service == 'be-user' && format('KEY={0}', secrets.CRYPTO_KEY) || '' }}

  deploy:
    if: needs.changes.outputs.services != '[]'
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cp .github/known_hosts ~/.ssh/known_hosts

      - name: Deploy selected services to preview
        env:
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          REGISTRY_USER: ${{ secrets.ALIYUN_USERNAME }}
          SERVICES: ${{ needs.changes.outputs.service_list }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail

          registry_b64="$(printf '%s' "$REGISTRY" | base64 -w 0)"
          registry_user_b64="$(printf '%s' "$REGISTRY_USER" | base64 -w 0)"
          registry_password_b64="$(printf '%s' "$REGISTRY_PASSWORD" | base64 -w 0)"
          services_b64="$(printf '%s' "$SERVICES" | base64 -w 0)"

          {
            printf "VERSION='%s'\n" "$VERSION"
            printf "SERVICES_B64='%s'\n" "$services_b64"
            printf "REGISTRY_B64='%s'\n" "$registry_b64"
            printf "REGISTRY_USER_B64='%s'\n" "$registry_user_b64"
            printf "REGISTRY_PASSWORD_B64='%s'\n" "$registry_password_b64"
            cat << 'REMOTE_SCRIPT'
          set -euo pipefail
          # Test environment: the preview compose project shares this host but
          # runs isolated on its own bridge network with PREV/test config.
          cd ~/ccnubox-preview

          REGISTRY="$(printf '%s' "$REGISTRY_B64" | base64 -d)"
          REGISTRY_USER="$(printf '%s' "$REGISTRY_USER_B64" | base64 -d)"
          REGISTRY_PASSWORD="$(printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d)"
          SERVICES="$(printf '%s' "$SERVICES_B64" | base64 -d)"
          read -r -a services <<< "$SERVICES"

          if ((${#services[@]} == 0)); then
            echo 'No services selected; nothing to deploy.'
            exit 0
          fi

          for service in "${services[@]}"; do
            case "$service" in
              be-ccnu|be-class|be-classlist|be-content|be-counter|be-elecprice|be-feed|be-grade|be-library|be-proxy|be-user|bff)
                ;;
              *)
                echo "Invalid service: $service" >&2
                exit 1
                ;;
            esac
          done

          (
            flock -x 200
            touch .env

            echo "$REGISTRY_PASSWORD" | docker login \
              --username="$REGISTRY_USER" \
              --password-stdin \
              "$REGISTRY"

            for service in "${services[@]}"; do
              KEY="$(printf '%s' "$service" | tr '[:lower:]-' '[:upper:]_')"
              if grep -q "^${KEY}=" .env; then
                sed -i "s/^${KEY}=.*/${KEY}=${VERSION}/" .env
              else
                echo "${KEY}=${VERSION}" >> .env
              fi
            done

            docker compose pull "${services[@]}"
            docker compose up -d "${services[@]}"
            docker image prune -a -f --filter "until=24h"
          ) 200>/tmp/ccnubox_deploy.lock
          REMOTE_SCRIPT
          } | ssh -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_ADDR" bash -s
