env: "prod"

otel:
  endpoint: "localhost:4318"

proxy:
  # remote 使用 be-proxy，direct 用于本地开发直连
  mode: "remote"

mysql:
  dsn: "root:password@tcp(localhost:3306)/ccnubox?charset=utf8mb4&parseTime=True&loc=Local"
  maxOpenConns: 30
  maxIdleConns: 10
  connMaxLifetimeSeconds: 1800
  connMaxIdleTimeSeconds: 300

redis:
  addr: "localhost:6379"
  password: "password"

etcd:
  endpoints:
    - "localhost:2379"
  username: "root"
  password: "password"

kafka:
  addrs:
    - "localhost:9094"
  username: "root"
  password: "password"

elasticsearch:
  urls:
    - "http://localhost:9200"
  username: "elastic"
  password: "password"
  sniff: false

grpc:
  ccnu:
    name: "ccnu"
    addr: ":20000"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  class:
    name: "class"
    addr: ":20001"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  classlist:
    name: "classlist"
    addr: ":20002"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
    serverTimeout: 2
  content:
    name: "content"
    addr: ":20003"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  counter:
    name: "counter"
    addr: ":20004"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  elecprice:
    name: "elecprice"
    addr: ":20005"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  feed:
    name: "feed"
    addr: ":20006"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  grade:
    name: "grade"
    addr: ":20007"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  library:
    name: "library"
    addr: ":20008"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  proxy:
    name: "proxy"
    addr: ":20009"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
  user:
    name: "user"
    addr: ":20010"
    weight: 100
    etcdTTL: 60
    clientTimeout: 60
