log:
  path: "/logs/app.log"
  maxSize: 100
  maxBackups: 7
  maxAge: 30
  compress: 1

otel:
  serviceName: "be-library"
  serviceVersion: "1.0.0"
  endpoint: "localhost:4318"

crypto:
  secret: ""  # 仅供旧 crawler 迁移兼容；提醒模块动态获取 HMAC key

libraryReminder:
  enabled: true
  preferenceSyncInterval: 15s
  preferenceFullSyncCron: "15 3 * * *"
  fullRefreshCron: "*/30 * * * *"
  fullRefreshMinInterval: 25m
  activeScanCron: "*/5 * * * *"
  activeScanMinInterval: 4m
  teamScanCron: "*/5 * * * *" # 组队中有效期约 60 分钟；仅在 teamSuccess 开启时注册
  teamScanMinInterval: 4m
  jobDispatchCron: "* * * * *"
  jobDispatchBatchSize: 100
  jobDispatchBudget: 1000
  jobDispatchConcurrency: 20
  outboxInterval: 2s
  claimRecoveryInterval: 1m
  claimTimeout: 30m
  userConcurrency: 20
  userJitter: 250ms
  upstreamRetryAttempts: 3
  upstreamQPS: 20 # 限制请求发起速率，不限制在途并发
  requestTimeout: 8s
  historyPageSize: 20
  historyLookbackDays: 3
  historyRetentionDays: 7
  retryMaxAttempts: 10
  baselineOnEnable: true
  dryRun: true
  notificationTypes:
    reservationDiscovered: true
    start30: true
    end10: true
    # 迁移时不补发无有效 episode 版本或缺少 episode 的旧暂离任务/outbox，由后续扫描建立可信状态。
    away60: true
    away80: true
    breach: true
    blacklisted: true
    teamSuccess: false # APP 消息及手机通知栏推送；联调完成后显式开启
    teamInvitation: false
  teamInvitation:
    maxRecipients: 20
    maxDeliveryAge: 15m
    requestTimeout: 15s
    maxConcurrentRequests: 4
    requestsPerMinute: 10
    recipientDailyLimit: 20
    preferenceMaxLag: 30s
    # 抓包确认端点、身份字段、有效期和全部成员枚举后才能开启，不猜测待确认状态。
    contractVerified: false
    pendingMemberStatuses: []
    knownMemberStatuses: []
