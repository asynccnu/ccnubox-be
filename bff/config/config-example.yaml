serviceName: "bff"

http:
  addr: ":8080"

administrators:
  - "1234567890"

jwt:
  jwtKey: ""
  refreshKey: ""
  encKey: "ccnubox"

oss:
  accessKey: ""
  secretKey: ""
  bucketName: ""
  domainName: "" # CDN 域名
  baseName: ""
  fileName: ""


# 日志配置
log:
  path: "/logs/app.log"  # 日志文件路径
  maxSize: 100           # 单个日志文件的最大大小（MB）
  maxBackups: 7          # 保留旧日志文件的最大数量
  maxAge: 30             # 日志文件保留天数
  compress: 1             # 是否压缩旧日志文件（1 表示压缩，0 表示不压缩）

# Prometheus 配置
prometheus:
  namespace: "ccnubox" # Prometheus 命名空间，通常为项目名称

  routerCounter:
    name: "http_requests_total"  # 路由请求总数指标名称
    help: "Total number of HTTP requests" # 指标说明

  activeConnections:
    name: "active_connections"  # 活跃连接指标名称
    help: "Number of active connections per route" # 指标说明

  durationTime:
    name: "http_request_duration_seconds"  # 请求时长直方图名称
    help: "Histogram of response times for HTTP requests" # 指标说明

  activeUsers24h:
    name: "active_users_24h"
    help: "Unique active users over the rolling 24-hour window calculated by Redis HyperLogLog"

basicAuth:
  username: ""
  password: ""

clientMetrics:
  clientKey: ""
  maxBatchSize: 100
  maxBodyBytes: 65536
  maxAppVersions: 32

tiered:
  high: 15  #单位是分钟
  middle: 30 #单位是分钟
  low: 60 #单位是分钟

# Backend recipient selection. Apifox only sends {"strategy":"high_activity"}.
# high_activity counts authenticated requests on complete Asia/Shanghai days.
# Users active on at least 5 of the last 7 complete days are selected.
# First deployment needs 7 complete days; the partial first day is excluded.
# v2 history starts fresh; legacy best-effort sets cannot be certified.
# Authentication queues exact IDs synchronously (503 if Redis admission fails).
# The daily heartbeat replays pending IDs and seals closed days before selection.
# script runs a trusted command and reads a JSON array of student IDs from stdout.
# Configure the command on the server; no command or student IDs enter the HTTP API.
# all 策略筛选已注册的在校用户，按四年学制和北京时间 6 月 30 日毕业判断。
# 全量名单无需活跃历史；名单有效期为 7 天。
feedWhiteList:
  windowDays: 7
  minActiveDays: 5
  scriptCommand: [] # e.g. ["python3", "/app/scripts/select_survey_users.py"]
